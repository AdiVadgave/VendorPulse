# SonarQube project configuration for VendorPulse
#
# The Shell SonarQube/platform team provides:
#   - sonar.projectKey  (fill in below)
#   - the server URL     -> set as GitHub Actions Variable  SONAR_HOST_URL
#   - an analysis token  -> set as GitHub Actions Secret     SONAR_TOKEN
#
# Analyzes both the Python backend and the TypeScript frontend.
# NOTE: the CI SonarQube job is non-blocking until these values are provided.

sonar.projectKey=com.shell.dnr-mnc-Mobility-VendorPulse
sonar.projectName=VendorPulse

# What to scan (repo root has backend/ and frontend/)
sonar.sources=backend/app,frontend/src

# Language hints
sonar.python.version=3.11

# Keep generated / vendored / local files out of the scan
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/__pycache__/**,**/*.min.js,**/mock/**

# (Optional, once tests + coverage exist)
# sonar.python.coverage.reportPaths=backend/coverage.xml
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
